<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AgriTrade+ — the agricultural marketplace connecting farmers and buyers.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AgriTrade+">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="agritrade_favicon.png"/>

  <title>AgriTrade+</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBbYUgbR0tHaSfrujL8184AXYOCTP5W6NE"></script>
  <!--
    What shows while Flutter downloads, so the page is never blank: a copy
    of the app's own loading screen (BrandedLoadingScreen and
    SproutLoadingBar in lib/widgets) — the round logo, the name, the green
    bar with its sprout and "Loading AgriTrade+…" — in the same sizes and
    colours. Flutter's bar carries on from this one's fill (it reads
    window.agriTradeSplashStart), and this one goes when Flutter draws its
    first frame, so the handoff does not show. Keep the two in step.
  -->
  <link rel="preload" href="assets/assets/fonts/Montserrat-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Montserrat-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "AgriTrade Montserrat"; font-weight: 700; font-display: swap;
      src: url("assets/assets/fonts/Montserrat-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "AgriTrade Montserrat"; font-weight: 500; font-display: swap;
      src: url("assets/assets/fonts/Montserrat-Medium.ttf") format("truetype");
    }
    /* How full the bar is, 0 to 1, animated like Flutter's (easeInOut). */
    @property --fill { syntax: "<number>"; inherits: true; initial-value: 0; }
    html, body { height: 100%; margin: 0; background: #FFFFFF; }
    #app-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #FFFFFF;
      font-family: "AgriTrade Montserrat", Montserrat, "Segoe UI", Roboto, Arial, sans-serif;
      transition: opacity .25s ease;
    }
    #app-splash.done { opacity: 0; pointer-events: none; }
    #app-splash .logo {
      width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
    }
    #app-splash .name {
      /* The padding matches the room Flutter leaves above and below this
         text (measured on screenshots of the two). */
      margin: 18px 0 28px; padding: 3px 0 2px; line-height: normal;
      font-size: 26px; font-weight: 700; letter-spacing: 0.26px;
      color: #0E3210;
    }
    #app-splash .bar {
      position: relative; width: min(260px, calc(100vw - 48px)); height: 28px;
      --fill: 0;
      animation: app-splash-fill 12s linear forwards;
    }
    #app-splash .track {
      position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
      border-radius: 3px; overflow: hidden; background: #C5DEB0;
    }
    #app-splash .fill {
      height: 100%; width: calc(var(--fill) * 100%); border-radius: 3px;
      background: linear-gradient(to right, #0E3210, #3F8F2A);
    }
    /* The sprout stands where the fill ends (kept on the bar at both ends),
       growing from 55% to full size as the bar fills. */
    #app-splash .sprout {
      position: absolute; top: 23px; width: 0; height: 0;
      left: clamp(6px, calc(var(--fill) * 100%), calc(100% - 6px));
      transform: scale(calc(0.55 + 0.45 * var(--fill)));
      transform-origin: 0 0;
    }
    #app-splash .sprout svg {
      position: absolute; left: -10px; top: -21px; overflow: visible;
    }
    #app-splash .label {
      margin-top: 12px; padding: 1px 0 2px; line-height: normal;
      font-size: 13px; font-weight: 500; letter-spacing: 0.2px;
      color: rgba(0, 0, 0, 0.54); white-space: nowrap;
    }
    /* Quickly (easing out) to 70% in 2.1 s, then creeping on to 90% by
       12 s, where it waits: it never fills while Flutter downloads, so
       Flutter's bar always has the last stretch to fill in view. Keep in
       step with SproutLoadingBar.pageBarProgress. */
    @keyframes app-splash-fill {
      0% { --fill: 0; animation-timing-function: cubic-bezier(0, 0, .58, 1); }
      17.5% { --fill: 0.7; animation-timing-function: linear; }
      100% { --fill: 0.9; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .bar { animation: none; --fill: 0.66; }
    }
  </style>

</head>
<body>
  <div id="app-splash" role="status" aria-label="Loading AgriTrade+">
    <img class="logo" src="reset-password/logo.png" alt="">
    <div class="name">AgriTrade+</div>
    <div class="bar">
      <div class="track"><div class="fill"></div></div>
      <div class="sprout">
        <svg width="21" height="22" viewBox="-10 -21 21 22" aria-hidden="true">
          <line x1="0" y1="0" x2="0" y2="-11" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round"/>
          <path fill="#2E7D32" d="M0 -11 Q-0.913 -19.036 -9 -19 Q-8.087 -10.964 0 -11 Z"/>
          <path fill="#4CA531" d="M0 -11 Q9.148 -10.892 10 -20 Q0.852 -20.108 0 -11 Z"/>
        </svg>
      </div>
    </div>
    <div class="label" aria-hidden="true">Loading AgriTrade+…</div>
  </div>
  <script>
    // The bar above starts filling now; Flutter's bar picks up from here.
    window.agriTradeSplashStart = Date.now();
  </script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
